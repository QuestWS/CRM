<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CRM{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">{{ settings.operator_business or "CRM" }}</a>
  <nav>
    <a href="/">Today</a>
    <a href="/contacts">People</a>
    <a href="/calls">Calls</a>
    <a href="/tasks">Tasks</a>
    <a href="/calendar">Calendar</a>
    <a href="/brief">Brief</a>
  </nav>
  <form class="search" action="/contacts" method="get">
    <input type="search" name="q" placeholder="Search people, numbers, notes&hellip;"
           value="{{ q or '' }}">
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
