# Twenty CRM plus the Quest assistant.
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up -d
#
# Every image here publishes linux/arm64, so this runs on Oracle Cloud's
# always-free Ampere A1 shape as-is. See docs/oracle-cloud-setup.md.

name: quest-crm

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD in .env}
      POSTGRES_DB: default
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-postgres} -d default"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: always
    # Twenty uses Redis as its job queue, so losing it loses queued work
    # rather than just a cache.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@db:5432/default
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${SERVER_URL:?set SERVER_URL — Twenty builds links from it}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      # Mailbox passwords are encrypted with this. Lose it and every connected
      # account has to be reconnected by hand.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      STORAGE_TYPE: local
      # IMAP / SMTP / CalDAV. On by default upstream; set explicitly so an
      # upstream default flip cannot quietly disconnect the mailbox.
      IS_IMAP_SMTP_CALDAV_ENABLED: "true"
      IS_IMAP_SMTP_CALDAV_CONNECTION_TEST_ENABLED: "true"
      # Transactional mail Twenty sends itself (invites, password resets).
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Quest Watersports}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "${TWENTY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Twenty's background jobs: fetching IMAP mail, matching participants to
  # people, running workflows. Without this the mailbox never syncs and
  # nothing looks broken.
  worker:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: always
    command: ["yarn", "worker:prod"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@db:5432/default
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${SERVER_URL}
      APP_SECRET: ${APP_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_TYPE: local
      IS_IMAP_SMTP_CALDAV_ENABLED: "true"
      DISABLE_DB_MIGRATIONS: "true"          # the server already ran them
      DISABLE_CRON_JOBS_REGISTRATION: "true" # and registered the crons
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage

  # The assistant: reads what Twenty synced, writes back notes and tasks.
  assistant:
    build: .
    restart: always
    depends_on:
      server:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network Twenty is reachable by service name,
      # whatever SERVER_URL says for your browser.
      TWENTY_URL: http://server:3000
      DATABASE_URL: sqlite:////data/assistant.db
      MEDIA_ROOT: /data/media
    volumes:
      - assistant-data:/data
    ports:
      - "${ASSISTANT_PORT:-8000}:8000"

volumes:
  db-data:
  redis-data:
  server-local-data:
  assistant-data:
